<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hostapd Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <h1>📡 Hostapd Dashboard</h1>

    <div id="stats">
        <h2>Verbundene Geräte</h2>
        <table id="clients">
            <thead>
                <tr>
                    <th>MAC</th>
                    <th>Signal (dBm)</th>
                    <th>TX Bytes</th>
                    <th>RX Bytes</th>
                    <th>Inaktiv (s)</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="5">Lade...</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
